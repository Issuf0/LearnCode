<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Code — Websites, Sistemas e IA em Moçambique</title>
    <meta name="description" content="A Learn Code desenvolve websites, aplicações móveis, sistemas de gestão e soluções de inteligência artificial para empresas e instituições em Moçambique. Peça o seu orçamento pelo WhatsApp." />
    <meta name="theme-color" content="#1a9cd8" />
    <script>
      // Aplica o tema antes do React arrancar, para evitar "flash" de tema errado.
      (function () {
        try {
          var mode = localStorage.getItem('lc-theme');
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <meta property="og:title" content="Learn Code — Websites, Sistemas e IA em Moçambique" />
    <meta property="og:description" content="Transformamos ideias em soluções digitais. Websites, apps, sistemas e IA entregues por uma equipa moçambicana." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_MZ" />
    <meta property="og:image" content="/og-image.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
